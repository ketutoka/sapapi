version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sapapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sapdwh
      POSTGRES_USER: sapapi_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sapapi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapapi_user -d sapdwh"]
      interval: 30s
      timeout: 10s
      retries: 3

  # SAP API Application
  sapapi:
    build: 
      context: .
      dockerfile: deployment/Dockerfile
    container_name: sapapi-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sapapi_user:${DB_PASSWORD:-changeme}@postgres:5432/sapdwh
      SECRET_KEY: ${SECRET_KEY:-please-change-this-secret-key}
      FLASK_ENV: production
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - app_logs:/var/log/sapapi
    networks:
      - sapapi-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: sapapi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx-docker.conf:/etc/nginx/conf.d/default.conf
      - ./deployment/ssl:/etc/ssl/certs
      - nginx_logs:/var/log/nginx
    networks:
      - sapapi-network
    depends_on:
      - sapapi
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis (for caching - optional)
  redis:
    image: redis:7-alpine
    container_name: sapapi-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - sapapi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  app_logs:
    driver: local
  nginx_logs:
    driver: local
  redis_data:
    driver: local

networks:
  sapapi-network:
    driver: bridge